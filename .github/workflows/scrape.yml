name: Kesinti verisini güncelle

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Toplayıcıyı çalıştır
        working-directory: scraper
        run: node src/index.js
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Değişiklik varsa commit'le
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "veri güncelle"
          file_pattern: scraper/data/kesintiler.json
          commit_user_name: kesinti-bot
          commit_user_email: kesinti-bot@users.noreply.github.com
