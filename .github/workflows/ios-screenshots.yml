name: iOS App Store ekran görüntüleri (Simülatör)

# Gerçek Apple iOS Simülatörü'nde (GitHub'ın macOS runner'ı) çalışır — sahte/
# uyarlanmış Android ekran görüntüsü değil, App Store kurallarına tam uygun.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    # DİKKAT: bu değişkenler iş seviyesinde olmalı. JS paketi prebuild'de değil,
    # xcodebuild'in "Bundle React Native code and images" fazında üretiliyor;
    # sadece prebuild adımına verildiğinde uygulama canlı veri adresini
    # göremeyip mock veriye düşüyordu (ekran görüntüsü boş çıkıyordu).
    env:
      EXPO_PUBLIC_API_BASE: https://jihjwemjqgrysbinskun.supabase.co/storage/v1/object/public/veri/kesintiler.json
      EXPO_PUBLIC_API_YEDEK: https://raw.githubusercontent.com/xbabazibazi/istanbul-kesinti/main/scraper/data/kesintiler.json
      EXPO_PUBLIC_SUPABASE_URL: https://jihjwemjqgrysbinskun.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_HtGYMBbLTMuNyEEh_-XA_g_-VVvYMQs
      # Mağaza görsellerinde AdMob'un "Test mode" test reklamı görünmesin.
      EXPO_PUBLIC_REKLAM_KAPALI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install

      - name: iOS native projesini oluştur
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods kur
        run: cd ios && pod install

      - name: Xcode workspace/scheme adını bul
        id: xc
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # DİKKAT: xcodebuild -list'teki İLK şemayı almak YANLIŞ — liste alfabetik
          # ve CocoaPods şemaları (EXApplication vb.) uygulamanın önüne geçiyor,
          # o zaman pod kütüphanesi derlenip .app hiç üretilmiyor. Şema adı her
          # zaman .xcodeproj'un adıdır.
          SCHEME=$(basename "$(ls -d *.xcodeproj | head -1)" .xcodeproj)
          echo "İş alanı: $WORKSPACE, şema: $SCHEME"
          echo "Mevcut şemalar:"
          xcodebuild -workspace "$WORKSPACE" -list | sed -n '/Schemes:/,$p' | head -20
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Simülatör için derle (imzalama yok)
        run: |
          cd ios
          xcodebuild -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "--- üretilen .app dosyaları ---"
          find build -type d -name "*.app" | head

      # NOT: Dokunma otomasyonu (idb) denendi ve terk edildi — fb-idb önce
      # Homebrew'ün Python 3.14'ünde çöküyordu, düzeltilince de erişilebilirlik
      # köprüsü "No translation object returned for simulator" verdi. Onun
      # yerine uygulamanın kayıtlı verisi doğrudan yazılıp istenen ekran
      # açtırılıyor; hiç dokunma gerekmiyor ve sonuç deterministik.
      - name: Python 3.11 kur (yardımcı betikler için)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Simülatörü başlat, uygulamayı kur ve aç
        id: run
        run: |
          set -e
          # App Store'un "iPhone 6.5 inç" slotu yalnızca şu ölçüleri kabul ediyor:
          # 1242x2688 (iPhone 11 Pro Max / XS Max) veya 1284x2778 (12/13 Pro Max, 14 Plus).
          # Bu yüzden önce o cihazları deniyoruz — böylece görüntü yerel
          # çözünürlükte çıkıyor, sonradan ölçeklemeye hiç gerek kalmıyor.
          # Hiçbiri yoksa en son çare olarak 6.9 inç cihaza düşüyoruz.
          echo "--- kullanılabilir iPhone simülatörleri ---"
          xcrun simctl list devices available | grep -i "iPhone" || true

          DEVICE_ID=""
          for ADAY in "iPhone 11 Pro Max" "iPhone XS Max" "iPhone 14 Plus" "iPhone 13 Pro Max" "iPhone 12 Pro Max" "iPhone 16 Pro Max"; do
            DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "$ADAY (" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' || true)
            if [ -n "$DEVICE_ID" ]; then
              echo ">> seçilen cihaz: $ADAY ($DEVICE_ID)"
              break
            fi
            echo "   $ADAY bulunamadı, sonraki deneniyor"
          done
          if [ -z "$DEVICE_ID" ]; then
            echo "!! uygun iPhone simülatörü bulunamadı"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          # .app'i mutlak yolla ara — simctl install boş/göreli yolda
          # "Invalid parameter not satisfying: installURL" ile çöküyor.
          APP_PATH=$(find "$PWD/ios/build" -type d -name "*.app" 2>/dev/null | grep -i "iphonesimulator" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "!! .app bulunamadı. ios/build içindeki .app adayları:"
            find "$PWD/ios" -type d -name "*.app" 2>/dev/null | head -20 || true
            echo "!! Products dizini:"
            ls -R ios/build/Build/Products 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "app: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "bundle: $BUNDLE_ID"
          echo "device=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Ekran görüntüleri al
        run: |
          set -e
          DEVICE_ID="${{ steps.run.outputs.device }}"
          BUNDLE_ID="${{ steps.run.outputs.bundle }}"
          mkdir -p ../ekran-goruntuleri

          ss() {
            echo ">> ekran görüntüsü: $1"
            xcrun simctl io "$DEVICE_ID" screenshot "../ekran-goruntuleri/$1"
          }

          # 1) Temiz kurulum: il seçme ekranı
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 12
          ss 01-il-sec.png
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true

          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)
          echo "container: $CONTAINER"

          # Ana ekran: dokunma otomasyonu yerine uygulamanın kayıtlı ilçesini
          # doğrudan AsyncStorage'a yazıp uygulamayı o ekranda açtırıyoruz.
          # (idb'nin erişilebilirlik köprüsü yeni simülatörlerde çalışmıyor.)
          # Her tur farklı bir ilçe seçilir ki görüntüler birbirinin aynısı olmasın.
          ana_ekran() {
            local sira="$1" dosya="$2"
            local secim il kalan ilce ilce_key
            secim=$(python3 "$GITHUB_WORKSPACE/.github/scripts/dolu_ilce.py" "$PWD" "$EXPO_PUBLIC_API_BASE" "$sira")
            echo ">> sıra $sira için seçilen ilçe: $secim"
            il="${secim%%|*}"
            kalan="${secim#*|}"
            ilce="${kalan%%|*}"
            ilce_key="${kalan#*|}"

            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
            python3 "$GITHUB_WORKSPACE/.github/scripts/asyncstorage_yaz.py" \
              "$CONTAINER" "$BUNDLE_ID" "$il" "$ilce" "$ilce_key"
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
            sleep 14
            ss "$dosya"
          }

          ana_ekran 0 02-ana-ekran.png
          ana_ekran 1 03-ana-ekran-2.png

          echo "--- üretilen görüntülerin ölçüleri (App Store slotuna uymalı) ---"
          for f in ../ekran-goruntuleri/*.png; do
            echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"
          done

          # --- App Preview videosu ---
          # DİKKAT: Apple App Preview'ları 15-30 saniye kabul ediyor (1 dakika
          # reddedilir). Bekleme süreleri toplam ~27 sn olacak şekilde ayarlandı.
          # Dokunma otomasyonu (idb) çalışmadığı için video, ekranlar arası
          # geçişten oluşuyor; kaydırmalı/dokunmalı bir demo değil.
          echo ">> video kaydı başlıyor"
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 --force ../ekran-goruntuleri/tanitim-videosu.mp4 &
          KAYIT_PID=$!
          sleep 2

          video_ekran() {
            local sira="$1" bekle="$2"
            local secim il kalan ilce ilce_key
            secim=$(python3 "$GITHUB_WORKSPACE/.github/scripts/dolu_ilce.py" "$PWD" "$EXPO_PUBLIC_API_BASE" "$sira")
            il="${secim%%|*}"; kalan="${secim#*|}"; ilce="${kalan%%|*}"; ilce_key="${kalan#*|}"
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
            python3 "$GITHUB_WORKSPACE/.github/scripts/asyncstorage_yaz.py" \
              "$CONTAINER" "$BUNDLE_ID" "$il" "$ilce" "$ilce_key" > /dev/null
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
            sleep "$bekle"
          }

          video_ekran 0 12
          video_ekran 1 12

          echo ">> video kaydı durduruluyor"
          kill -INT "$KAYIT_PID" 2>/dev/null || true
          wait "$KAYIT_PID" 2>/dev/null || true
          sleep 3

          if [ -f ../ekran-goruntuleri/tanitim-videosu.mp4 ]; then
            echo "video hazır: $(ls -lh ../ekran-goruntuleri/tanitim-videosu.mp4 | awk '{print $5}')"
          else
            echo "!! video üretilemedi (kritik değil, ekran görüntüleri yeterli)"
          fi

          ls -la ../ekran-goruntuleri/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ekran-goruntuleri
          path: ekran-goruntuleri/
          if-no-files-found: warn
