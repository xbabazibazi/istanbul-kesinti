name: iOS App Store ekran görüntüleri (Simülatör)

# Gerçek Apple iOS Simülatörü'nde (GitHub'ın macOS runner'ı) çalışır — sahte/
# uyarlanmış Android ekran görüntüsü değil, App Store kurallarına tam uygun.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install

      - name: iOS native projesini oluştur
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_PUBLIC_API_BASE: https://jihjwemjqgrysbinskun.supabase.co/storage/v1/object/public/veri/kesintiler.json
          EXPO_PUBLIC_API_YEDEK: https://raw.githubusercontent.com/xbabazibazi/istanbul-kesinti/main/scraper/data/kesintiler.json
          EXPO_PUBLIC_SUPABASE_URL: https://jihjwemjqgrysbinskun.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_HtGYMBbLTMuNyEEh_-XA_g_-VVvYMQs

      - name: CocoaPods kur
        run: cd ios && pod install

      - name: Xcode workspace/scheme adını bul
        id: xc
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # DİKKAT: xcodebuild -list'teki İLK şemayı almak YANLIŞ — liste alfabetik
          # ve CocoaPods şemaları (EXApplication vb.) uygulamanın önüne geçiyor,
          # o zaman pod kütüphanesi derlenip .app hiç üretilmiyor. Şema adı her
          # zaman .xcodeproj'un adıdır.
          SCHEME=$(basename "$(ls -d *.xcodeproj | head -1)" .xcodeproj)
          echo "İş alanı: $WORKSPACE, şema: $SCHEME"
          echo "Mevcut şemalar:"
          xcodebuild -workspace "$WORKSPACE" -list | sed -n '/Schemes:/,$p' | head -20
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Simülatör için derle (imzalama yok)
        run: |
          cd ios
          xcodebuild -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "--- üretilen .app dosyaları ---"
          find build -type d -name "*.app" | head

      # fb-idb, Homebrew'ün Python 3.14'ünde çalışmıyor: idb'nin kullandığı
      # asyncio.get_event_loop() 3.14'te "no current event loop" hatası veriyor
      # ve hiçbir dokunma komutu çalışmıyor. 3.11 ile kuruyoruz.
      - name: Python 3.11 kur (fb-idb için)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: idb kur (dokunma otomasyonu için)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          brew tap facebook/fb
          brew trust facebook/fb || brew trust --formula facebook/fb/idb-companion || true
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --formula facebook/fb/idb-companion
          python3 -m pip install --upgrade pip
          python3 -m pip install fb-idb
          IDB_BIN="$(python3 -c 'import sys, os; print(os.path.join(sys.prefix, "bin", "idb"))')"
          echo "idb yolu: $IDB_BIN"
          "$IDB_BIN" --help > /dev/null && echo "idb çalışıyor ✓"
          echo "IDB=$IDB_BIN" >> "$GITHUB_ENV"

      - name: Simülatörü başlat, uygulamayı kur ve aç
        id: run
        run: |
          set -e
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone 16 Pro Max" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "cihaz: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          # .app'i mutlak yolla ara — simctl install boş/göreli yolda
          # "Invalid parameter not satisfying: installURL" ile çöküyor.
          APP_PATH=$(find "$PWD/ios/build" -type d -name "*.app" 2>/dev/null | grep -i "iphonesimulator" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "!! .app bulunamadı. ios/build içindeki .app adayları:"
            find "$PWD/ios" -type d -name "*.app" 2>/dev/null | head -20 || true
            echo "!! Products dizini:"
            ls -R ios/build/Build/Products 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "app: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "bundle: $BUNDLE_ID"
          idb_companion --udid "$DEVICE_ID" > /tmp/idb_companion.log 2>&1 &
          sleep 5
          "$IDB" list-targets || true
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 10
          echo "device=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Ekran görüntüleri al
        # set -e YOK: bir dokunma hedefi bulunamazsa bile o ana kadar alınan
        # görüntüler kaybolmasın, adım yine de tamamlansın.
        run: |
          DEVICE_ID="${{ steps.run.outputs.device }}"
          mkdir -p ../ekran-goruntuleri

          # UI ağacını dosyaya dök — bir etiket bulunamazsa artifact'tan
          # gerçek ağacı görüp seçiciyi düzeltebilelim.
          "$IDB" ui describe-all --udid "$DEVICE_ID" --json > ../ekran-goruntuleri/ui-agaci.json 2>&1 || true

          tap_metin() {
            "$IDB" ui describe-all --udid "$DEVICE_ID" --json 2>/dev/null | \
              python3 "$GITHUB_WORKSPACE/.github/scripts/bul_koordinat.py" "$1"
          }

          ss() {
            echo ">> ekran görüntüsü: $1"
            xcrun simctl io "$DEVICE_ID" screenshot "../ekran-goruntuleri/$1" || true
          }

          dokun() {
            local etiket="$1"
            local koord
            koord=$(tap_metin "$etiket")
            if [ -z "$koord" ]; then
              echo "!! '$etiket' UI ağacında bulunamadı, atlanıyor"
              return 1
            fi
            echo ">> dokun: $etiket ($koord)"
            "$IDB" ui tap --udid "$DEVICE_ID" $koord || return 1
            sleep 3
          }

          # İlçe eklenince uygulama bildirim izni istiyor; iOS'un sistem uyarısı
          # ekranı kaplayıp görüntüyü bozmasın diye varsa kapatılır.
          izin_uyarisini_kapat() {
            for etiket in "Allow" "İzin Ver" "Don't Allow"; do
              if dokun "$etiket"; then
                echo ">> bildirim izni uyarısı kapatıldı ($etiket)"
                return 0
              fi
            done
            return 0
          }

          ss 01-il-sec.png

          if dokun "İstanbul"; then
            ss 02-ilce-sec.png
            if dokun "Beşiktaş"; then
              izin_uyarisini_kapat
              sleep 5
              ss 03-ana-ekran.png
              "$IDB" ui describe-all --udid "$DEVICE_ID" --json > ../ekran-goruntuleri/ui-agaci-ana-ekran.json 2>&1 || true
              if dokun "Başka ilçeye bak"; then
                ss 04-baska-ilceye-bak.png
              fi
            fi
          fi

          ls -la ../ekran-goruntuleri/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ekran-goruntuleri
          path: ekran-goruntuleri/
          if-no-files-found: warn
